apiVersion: v2
name: yugen
description: Umbrella chart deploying the full Yugen Discord bot fleet
type: application
version: 0.1.9
appVersion: "main"
dependencies:
  - name: postgresql
    version: "18.8.5"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: valkey
    version: "6.2.5"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: valkey.enabled
  - name: hoshi
    version: "0.1.9"
    repository: "file://../hoshi"
    condition: hoshi.enabled
  - name: iro
    version: "0.1.9"
    repository: "file://../iro"
    condition: iro.enabled
  - name: kazu
    version: "0.1.9"
    repository: "file://../kazu"
    condition: kazu.enabled
  - name: kusari
    version: "0.1.9"
    repository: "file://../kusari"
    condition: kusari.enabled
  - name: koto
    version: "0.1.9"
    repository: "file://../koto"
    condition: koto.enabled
  - name: hachimitsu
    version: "0.1.9"
    repository: "file://../hachimitsu"
    condition: hachimitsu.enabled
