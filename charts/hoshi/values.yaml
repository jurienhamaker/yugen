replicaCount: 1

image:
  repository: ghcr.io/yugen-bot/hoshi
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Overrides the inline-migrate ENTRYPOINT baked into the image.
# Migrations run via the pre-upgrade hook Job instead.
command:
  - /opt/app/hoshi

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hoshi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Non-sensitive environment variables → rendered into a ConfigMap
config:
  ENV: "production"
  SHARD: "false"
  YUGEN_LOG_LEVEL: "info"
  YUGEN_DEBUG: "false"
  API_LISTEN_HOST: "0.0.0.0"
  API_LISTEN_PORT: "3000"
  SYNC_COMMANDS: "false"
  DISCORD_APP_ID: ""
  DISCORD_DEVELOPMENT_GUILD_ID: ""
  OWNER_IDS: ""
  OWNER_ID: ""
  DISCORD_LOGS_REPORT_CHANNEL_ID: ""
  DISCORD_VOTE_REPORT_CHANNEL_ID: ""
  TOP_GG_SYNC: "false"
  TOP_GG_VOTE_LINK: ""
  DISCORDBOTLIST_SYNC: "false"
  DISCORDBOTLIST_VOTE_LINK: ""
  INVITE_LINK: ""
  SENTRY_ENVIRONMENT: ""
  SENTRY_TRACES_SAMPLE_RATE: "0.0"
  SENTRY_DEBUG: "false"
  LOKI_HOST: ""
  LOKI_USERNAME: ""

# Sensitive environment variables → rendered into a Secret
# Set existingSecret to the name of a pre-created Secret to skip chart-managed secret creation.
# When existingSecret is set, all other fields below are ignored.
secrets:
  existingSecret: ""
  DISCORD_TOKEN: ""
  WEBHOOK_AUTHORIZATION_TOKEN: ""
  TOP_GG_TOKEN: ""
  DISCORDBOTLIST_TOKEN: ""
  LOKI_PASSWORD: ""
  SENTRY_DSN: ""
  # DATABASE_URL is only used when postgresql.enabled is false.
  # When postgresql.enabled is true, the URL is derived automatically from postgresql.auth.*.
  DATABASE_URL: ""

# Additional arbitrary env vars injected directly into the container.
# Useful for valueFrom references or one-off overrides.
# Example:
#   extraEnv:
#     - name: MY_VAR
#       value: "foo"
#     - name: MY_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: my-key
extraEnv: []

migrations:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: hoshi
    password: ""
    database: hoshi
  primary:
    persistence:
      enabled: true
      size: 8Gi
